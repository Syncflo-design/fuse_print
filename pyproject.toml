[project]
name = "fuse_print"
authors = [{ name = "Syncflo", email = "ops@syncflo.co.za" }]
description = "Sticker and label printing for Fuse: waste recorded at each workstation with a reason, and what it costs."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# ERPNext for the manufacturing engine. fuse_core for the module switches and, through
# fuse_theme, the tile on Fuse Home. fuse_manufacturing for Receiving and Picking.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "fuse_print"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Frappe apps indent with tabs; E101/W191 fight that convention, not real defects.
ignore = ["E101", "E501", "W191"]

[tool.ruff.lint.isort]
known-third-party = ["frappe", "erpnext", "fuse_core", "fuse_manufacturing"]

[tool.ruff.format]
indent-style = "tab"
